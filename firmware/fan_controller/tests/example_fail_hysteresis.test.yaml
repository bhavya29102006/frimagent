name: 'Fan must stay ON at 29 C after being ON (should FAIL: proves bug B2)'
version: 1
steps:
  - wait-serial: '[INFO] BOOT'
  - set-control:
      part-id: dht1
      control: temperature
      value: 31
  - wait-serial: 'temp=31.0 fan=ON'
  - set-control:
      part-id: dht1
      control: temperature
      value: 29
  - wait-serial: 'temp=29.0 fan=ON'
