name: 'Hysteresis Sequence Step to 28.0 C'
version: 1
steps:
- wait-serial: '[INFO] BOOT'
- set-control:
    part-id: 'dht1'
    control: 'temperature'
    value: 31
- wait-serial: 'temp=31.0 fan=ON'
- set-control:
    part-id: 'dht1'
    control: 'temperature'
    value: 28
- wait-serial: 'temp=28.0 fan=OFF'
